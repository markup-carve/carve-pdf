name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  released:
    name: released engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carve-pdf
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install carve-php from Packagist
        run: |
          mkdir -p _deps/php
          composer require --working-dir=_deps/php \
            markup-carve/carve-php --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the carve package from npm
        run: |
          mkdir -p _deps/js
          cd _deps/js
          npm init -y > /dev/null
          npm install "@markup-carve/carve" --no-audit --no-fund

      - name: Report the resolved engine versions
        run: |
          composer show --working-dir=_deps/php markup-carve/carve-php | grep -E '^(name|versions)'
          node -p "require('./_deps/js/node_modules/@markup-carve/carve/package.json').version"

      # The panel gate needs a browser and pdftotext, and it SKIPS without
      # them. A skipped gate reports success over the surface it never
      # rendered, which is the failure the gate itself exists to prevent, so
      # these are installed rather than left to the runner image.
      - name: Install the panel gate's dependencies
        run: |
          python3 -m pip install --quiet websocket-client \
            || python3 -m pip install --quiet --break-system-packages websocket-client
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          google-chrome --version

      - name: Run tests
        env:
          CARVE_PHP_AUTOLOAD: ${{ github.workspace }}/_deps/php/vendor/autoload.php
          CARVE_JS: ${{ github.workspace }}/_deps/js/node_modules/@markup-carve/carve/dist/index.js
        run: ./tests/test.sh

  engines-main:
    # Early warning for a breaking engine change. This one tracks the default
    # branches on purpose, so a red run here and a green `released` run mean the
    # engines moved, not carve-pdf.
    name: engines from main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carve-pdf
        uses: actions/checkout@v4

      - name: Checkout carve-php
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-php
          ref: main
          path: _deps/carve-php
      - name: Checkout carve-js
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-js
          ref: main
          path: _deps/carve-js

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Build carve-php autoloader
        working-directory: _deps/carve-php
        run: composer install --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build carve-js
        working-directory: _deps/carve-js
        run: |
          npm ci
          npm run build

      - name: Report the engine commits under test
        run: |
          git -C _deps/carve-php log -1 --format='carve-php %h %s'
          git -C _deps/carve-js log -1 --format='carve-js %h %s'

      # The panel gate needs a browser and pdftotext, and it SKIPS without
      # them. A skipped gate reports success over the surface it never
      # rendered, which is the failure the gate itself exists to prevent, so
      # these are installed rather than left to the runner image.
      - name: Install the panel gate's dependencies
        run: |
          python3 -m pip install --quiet websocket-client \
            || python3 -m pip install --quiet --break-system-packages websocket-client
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          google-chrome --version

      - name: Run tests
        env:
          CARVE_PHP_AUTOLOAD: ${{ github.workspace }}/_deps/carve-php/vendor/autoload.php
          CARVE_JS: ${{ github.workspace }}/_deps/carve-js/dist/index.js
        run: ./tests/test.sh
