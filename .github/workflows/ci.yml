name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes the run still going for it. Pushes to main each
# keep their own run (the run id is unique), so main's history stays complete.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs only read: checkouts, package installs, tests.
permissions:
  contents: read

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  # main is the Carve 0.2 port: both engines are built from the commits engine-pins.json names.
  engines-main:
    name: engines from main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout carve-pdf
        uses: actions/checkout@v7

      - name: Set up the pinned 0.2 engines and gate dependencies
        uses: ./.github/actions/setup
        with:
          engines: pinned

      - name: Run tests
        run: ./tests/test.sh

      - name: Check PDF command status
        run: |
          ./tests/pdf-status.sh
          CARVE_RENDERER=php ./tests/pdf-status.sh

      - name: Check delimited fence highlighting
        run: python3 tests/delimited.py

  corpus-content:
    # carve-pdf configures its own extension set over the engines. A wrong
    # registration there dropped container labels in seven corpus cases with
    # every structural assertion still green, so this compares the words of a
    # 0.2 render examples against their expected HTML on both backends. The
    # examples come from the pinned carve-js checkout used by the renderers.
    name: corpus content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout carve-pdf
        uses: actions/checkout@v7

      - name: Set up the pinned 0.2 engines
        uses: ./.github/actions/setup
        with:
          engines: pinned
          browser-gates: 'false'

      - name: Conformance examples keep their text
        run: |
          git -C _deps/carve-js log -1 --format='examples: carve-js %h %s'
          python3 tests/corpus-content.py _deps/carve-js/data/conformance/examples.json --sample 300
