name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes the run still going for it. Pushes to main each
# keep their own run (the run id is unique), so main's history stays complete.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs only read: checkouts, package installs, tests.
permissions:
  contents: read

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  released:
    name: released engines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout carve-pdf
        uses: actions/checkout@v4

      - name: Set up the released engines and gate dependencies
        uses: ./.github/actions/setup
        with:
          engines: released

      - name: Run tests
        run: ./tests/test.sh

  engines-main:
    # Early warning for a breaking engine change. This one tracks the default
    # branches on purpose, so a red run here and a green `released` run mean the
    # engines moved, not carve-pdf.
    name: engines from main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout carve-pdf
        uses: actions/checkout@v4

      - name: Set up the engines from main and gate dependencies
        uses: ./.github/actions/setup
        with:
          engines: main

      - name: Run tests
        run: ./tests/test.sh

  corpus-content:
    # carve-pdf configures its own extension set over the engines. A wrong
    # registration there dropped container labels in seven corpus cases with
    # every structural assertion still green, so this compares the words of a
    # corpus sample against the corpus HTML on both backends. It runs against
    # the engines from main because the corpus on main describes them; a
    # released engine can lag it.
    name: corpus content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout carve-pdf
        uses: actions/checkout@v4

      - name: Checkout the Carve corpus
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          ref: main
          path: _deps/carve
          sparse-checkout: tests/corpus
          sparse-checkout-cone-mode: true

      - name: Set up the engines from main
        uses: ./.github/actions/setup
        with:
          engines: main
          browser-gates: 'false'

      - name: Corpus sample keeps its text
        run: |
          git -C _deps/carve log -1 --format='corpus: carve %h %s'
          python3 tests/corpus-content.py _deps/carve/tests/corpus --sample 300
