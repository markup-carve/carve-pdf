name: Tag gate

# Nothing used to fire on a tag, so a tag could be cut from any commit on any
# branch and the first thing to notice would be an install. 0.1.0 was cut that
# way: the commit it named still carried absolute host paths as engine
# fallbacks, so it rendered on one machine and nowhere else.
#
# This refuses the tag instead. The version check is the leg no other check can
# reach, and running the suite here is what puts the leak guard between a tag
# and a release.

on:
  push:
    tags: ['*']
  # Rehearsal. A maintainer can run this against a branch with the tag they are
  # about to cut, and read the answer before the ref exists.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag name to check this ref against (e.g. 0.1.0)
        required: true

permissions:
  contents: read

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  gate:
    name: version and suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout carve-pdf
        uses: actions/checkout@v4

      - name: Resolve the tag under test
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # Before the engines, because this needs none of them and a disagreement
      # here is not worth a dependency install.
      - name: The tag agrees with crv2pdf.sh and CHANGELOG.md
        run: ./tests/version-gate.sh "${{ steps.tag.outputs.tag }}"

      - name: Set up the released engines and gate dependencies
        uses: ./.github/actions/setup
        with:
          engines: released

      - name: Run tests
        run: ./tests/test.sh
